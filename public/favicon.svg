<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" fill="none">
  <defs>
    <!-- Gear Blue 3D Gradient -->
    <linearGradient id="favGearGrad" x1="20" y1="10" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0099FF" />
      <stop offset="50%" stopColor="#005BFF" />
      <stop offset="100%" stopColor="#003399" />
    </linearGradient>

    <!-- Wrench Gold-to-Orange Gradient -->
    <linearGradient id="favWrenchGrad" x1="30" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFC800" />
      <stop offset="45%" stopColor="#FF7A00" />
      <stop offset="100%" stopColor="#E63900" />
    </linearGradient>

    <!-- Speed Streaks Gradients -->
    <linearGradient id="favStreakOrange" x1="0" y1="0" x2="60" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFB300" />
      <stop offset="100%" stopColor="#FF5500" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="favDropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.22" />
    </filter>
  </defs>

  <g filter="url(#favDropShadow)">
    <!-- Speed Motion Trails -->
    <!-- Top streak -->
    <rect x="8" y="42" width="34" height="8" rx="4" fill="url(#favStreakOrange)" />
    <circle cx="4" cy="46" r="4" fill="#005BFF" />
    
    <!-- Middle streak -->
    <rect x="6" y="56" width="42" height="9" rx="4.5" fill="#0A2540" />
    <circle cx="2" cy="60.5" r="3" fill="#0099FF" />
    
    <!-- Bottom streak -->
    <rect x="12" y="71" width="30" height="8" rx="4" fill="url(#favStreakOrange)" />
    <circle cx="6" cy="75" r="4" fill="#FFB300" />

    <circle cx="18" cy="85" r="4.5" fill="#FF5500" />
    <circle cx="28" cy="92" r="3" fill="#005BFF" />

    <!-- White Contour Silhouette Background -->
    <path
      d="M74 15L84 15L86 24L95 28L103 22L110 28L104 36L108 45L117 47L117 56L108 58L104 67L110 75L103 81L95 75L86 79L84 88L74 88L72 79L63 75L55 81L48 75L55 67L51 58L42 56L42 47L51 45L55 36L48 28L55 22L63 28L72 24Z"
      fill="#FFFFFF"
      stroke="#FFFFFF"
      stroke-width="14"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Main Mechanical Gear Cog -->
    <path
      d="M74 17L84 17L86 26L94.5 30L102 24.5L108 30.5L102 38.5L106 47L114.5 49L114.5 58L106 60L102 68.5L108 75.5L102 81.5L94.5 76L86 80L84 89L74 89L72 80L63.5 76L56 81.5L50 75.5L56 68.5L52 60L43.5 58L43.5 49L52 47L56 38.5L50 30.5L56 24.5L63.5 30L72 26Z"
      fill="url(#favGearGrad)"
      stroke="#003399"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- Gear Center Cavity -->
    <circle cx="79" cy="53" r="21" fill="#061830" stroke="#002266" stroke-width="1.5" />

    <!-- Wrench Tool Graphic inside Cavity -->
    <g transform="rotate(-38 79 53)">
      <!-- Wrench Handle -->
      <path
        d="M73 43 L85 43 L83 75 C83 78 77 78 77 75 Z"
        fill="url(#favWrenchGrad)"
        stroke="#FFFFFF"
        stroke-width="1.8"
      />
      <!-- Wrench Open Head -->
      <path
        d="M66 43 C66 36 72 30 79 30 C86 30 92 36 92 43 C92 45 90 47 88 46 C85 45 83 40 79 40 C75 40 73 45 70 46 C68 47 66 45 66 43 Z"
        fill="url(#favWrenchGrad)"
        stroke="#FFFFFF"
        stroke-width="1.8"
        stroke-linejoin="round"
      />
    </g>

    <!-- Clicking White Computer Cursor Arrow -->
    <g transform="translate(68, 51)">
      <!-- Cursor White Outer Die-Cut / Stroke -->
      <path
        d="M0 0 L29 29 L17 31 L26 51 L18 55 L9 35 L-2 45 Z"
        fill="#FFFFFF"
        stroke="#071E36"
        stroke-width="4.5"
        stroke-linejoin="round"
        stroke-linecap="round"
      />
      <!-- Cursor Inner Fill -->
      <path
        d="M2 4 L25 27 L15 28.5 L22 46 L17 48 L10 31 L0 39 Z"
        fill="#FFFFFF"
      />
      <!-- Sky Blue Highlight Accent -->
      <path
        d="M2 4 L0 39 L6 33 L2 4 Z"
        fill="#00B0FF"
        opacity="0.4"
      />
    </g>
  </g>
</svg>
